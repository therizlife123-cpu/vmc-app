<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Teacher - VMC</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h3 class="fw-bold mb-4">
                        ✏️ Edit Teacher
                    </h3>


                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% for category, message in messages %}

                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endwith %}


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Teacher Name
                            </label>

                            <input
                                type="text"
                                name="teacher_name"
                                class="form-control"
                                value="{{ teacher[1] }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                value="{{ teacher[2] }}"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                New Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                minlength="6"
                            >

                            <small class="text-muted">
                                Leave blank if you don't want to change
                                the password.
                            </small>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Changes
                            </button>

                            <a
                                href="{{ url_for('teacher_management') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
